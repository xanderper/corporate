name: virex

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  virex-internal:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  minio_data:

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: virex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virex_secret}
      POSTGRES_DB: ${POSTGRES_DB:-virex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - virex-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virex} -d ${POSTGRES_DB:-virex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: virex-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - virex-internal
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: virex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-virex_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-virex_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - virex-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Applications
  # ──────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: virex-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3201}:3201"
    environment:
      NODE_ENV: production
      PORT: 3201
      DATABASE_URL: postgresql://${POSTGRES_USER:-virex}:${POSTGRES_PASSWORD:-virex_secret}@postgres:5432/${POSTGRES_DB:-virex}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-virex_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-virex_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-virex-documents}
    networks:
      - virex-internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    container_name: virex-portal
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-3203}:3203"
    environment:
      NODE_ENV: production
      PORT: 3203
      API_BASE_URL: http://api:3201
      NEXT_PUBLIC_QORVE_CHECKOUT_URL: ${NEXT_PUBLIC_QORVE_CHECKOUT_URL:-http://localhost:3004}
      NEXT_PUBLIC_QORVE_API_URL: ${NEXT_PUBLIC_QORVE_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_QORVE_MERCHANT_PUBLISHABLE_KEY: ${NEXT_PUBLIC_QORVE_MERCHANT_PUBLISHABLE_KEY:-qk_pub_xxxxxxxx}
    networks:
      - virex-internal
    depends_on:
      - api

  holding:
    build:
      context: .
      dockerfile: apps/holding/Dockerfile
    container_name: virex-holding
    restart: unless-stopped
    ports:
      - "${HOLDING_PORT:-3200}:3200"
    environment:
      NODE_ENV: production
      PORT: 3200
    networks:
      - virex-internal

  capital:
    build:
      context: .
      dockerfile: apps/capital/Dockerfile
    container_name: virex-capital
    restart: unless-stopped
    ports:
      - "${CAPITAL_PORT:-3202}:3202"
    environment:
      NODE_ENV: production
      PORT: 3202
    networks:
      - virex-internal
